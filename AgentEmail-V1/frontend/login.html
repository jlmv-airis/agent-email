<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Email AIRIS - Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --primary-50: rgba(37, 99, 235, 0.08);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
            --space-5: 20px; --space-6: 24px; --space-8: 32px;
            --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem;
            --text-lg: 1.125rem; --text-xl: 1.25rem; --text-2xl: 1.5rem;
            --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
            --radius-xl: 20px; --radius-2xl: 24px; --radius-full: 9999px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
            --shadow-xl: 0 16px 48px rgba(0,0,0,0.12);
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: rgba(0,0,0,0.06);
        }
        .dark-mode {
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --shadow-xl: 0 16px 48px rgba(0,0,0,0.6);
            --bg-primary: #090b10;
            --bg-card: #16181e;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: rgba(255,255,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .bg-pattern {
            position: fixed; inset: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.04) 1px, transparent 0);
            background-size: 40px 40px; pointer-events: none;
        }
        .dark-mode .bg-pattern {
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
        }
        .login-card {
            width: 420px;
            background: var(--bg-card);
            border-radius: var(--radius-2xl);
            padding: var(--space-8);
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-xl);
            z-index: 10;
            animation: fadeInUp 0.6s ease;
            transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .logo { text-align: center; margin-bottom: var(--space-8); }
        .logo h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: var(--space-2); line-height: 1.2; }
        .logo-main { color: var(--text-primary); }
        .logo-accent { color: var(--primary); }
        .logo p { font-size: var(--text-xs); font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.2em; }
        .form-group { margin-bottom: var(--space-5); }
        .form-label { display: block; font-size: var(--text-xs); font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: var(--space-3); }
        .form-input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: var(--space-4) var(--space-5);
            font-size: var(--text-sm); font-weight: 400;
            color: var(--text-primary); outline: none;
            transition: all 0.2s ease;
        }
        .form-input::placeholder { color: var(--text-secondary); opacity: 0.4; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .submit-btn {
            width: 100%;
            background: var(--primary); color: white;
            font-size: var(--text-sm); font-weight: 600;
            padding: var(--space-4) var(--space-5);
            border-radius: var(--radius-full);
            border: none; cursor: pointer;
            transition: all 0.2s ease;
            margin-top: var(--space-3);
            position: relative; overflow: hidden;
            box-shadow: 0 4px 14px rgba(37,99,235,0.25);
        }
        .submit-btn:hover { background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.3); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .submit-btn.loading { color: transparent; }
        .submit-btn.loading .btn-text { display: none; }
        .submit-btn.loading .spinner { display: block; }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; display: none;
            animation: btn-spin 0.8s linear infinite;
            position: absolute; top: 50%; left: 50%; margin-left: -9px; margin-top: -9px;
        }
        @keyframes btn-spin { to { transform: rotate(360deg); } }
        .error-message {
            font-size: var(--text-xs); font-weight: 500; color: var(--error);
            text-align: center; padding: var(--space-3);
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: var(--radius-full); margin-top: var(--space-4);
            display: none; animation: fadeIn 0.3s ease;
        }
        .error-message.visible { display: block; animation: shake 0.4s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
        .caps-warning { font-size: var(--text-xs); font-weight: 500; color: var(--warning); margin-top: var(--space-2); display: flex; align-items: center; gap: var(--space-2); opacity: 0; transition: opacity 0.2s; }
        .caps-warning.visible { opacity: 1; }
        .theme-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; box-shadow: var(--shadow-sm);
        }
        .theme-btn:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
        .dark-mode #theme-icon-sun { display: none; }
        .dark-mode #theme-icon-moon { display: block; }
        #theme-icon-moon { display: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <button class="theme-btn" onclick="toggleTheme()" title="Cambiar tema">
        <svg id="theme-icon-sun" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
    </button>
    
    <div class="login-card">
        <div class="logo">
            <h1>
                <span class="logo-main">Agent Email</span>
                <span class="logo-accent">AIRIS</span>
            </h1>
            <p>Command Center</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="login-email" required class="form-input" placeholder="correo@empresa.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" id="login-password" required class="form-input" placeholder="••••••••" autocomplete="current-password">
                <div id="caps-lock-warning" class="caps-warning">
                    <span>⚠</span>
                    <span>Bloq. Mayúsculas activo</span>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">
                <span class="btn-text">Iniciar Sesión</span>
                <span class="spinner"></span>
            </button>
        </form>
        
        <p id="login-error" class="error-message"></p>
    </div>

    <script>
        const API_URL = '/api';
        
        function toggleTheme() {
            document.documentElement.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        function applyTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') document.documentElement.classList.add('dark-mode');
        }
        applyTheme();
        
        const passwordInput = document.getElementById('login-password');
        const capsWarning = document.getElementById('caps-lock-warning');
        
        passwordInput.addEventListener('keyup', (e) => {
            capsWarning.classList.toggle('visible', e.getModifierState('CapsLock'));
        });
        passwordInput.addEventListener('blur', () => {
            capsWarning.classList.remove('visible');
        });
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('submit-btn');
            
            errorEl.classList.remove('visible');
            btn.classList.add('loading');
            btn.disabled = true;
            
            try {
                const res = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.error || 'Error al iniciar sesión');
                }
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.replace('index.html');
            } catch(err) {
                btn.classList.remove('loading');
                btn.disabled = false;
                errorEl.textContent = err.message;
                errorEl.classList.add('visible');
            }
        });
    </script>
</body>
</html>
